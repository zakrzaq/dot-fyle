backend = "glx";
opacity = true;
vsync = true;
# glx-swap-method = "copy";  # Alternative: "copy" for better compatibility


# inactive-opacity = 0.925;
focused-opacity = 1;

opacity-rule = [
  "100:class_g = 'Alacritty'",
  "100:class_g = 'org.wezfurlong.wezterm'",
  "100:class_g = 'dev.zed.Zed'",
  "100:class_g = 'Code'",
  "100:name *= 'Netflix'",
  "100:name *= 'Picture-in-picture'",
  "0:_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[0]:32a *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[1]:32a *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[2]:32a *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[3]:32a *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[4]:32a *= '_NET_WM_STATE_HIDDEN'"
];

# Enable and set rounded corners
corner-radius = 8
shadow-radius = 15

# Enable shadows
shadow = true
no-dock-shadow = true

# Gap settings for floating windows
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'"
];

