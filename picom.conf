backend = "glx";
opacity = true;
vsync = true;
# glx-swap-method = "copy";  # Alternative: "copy" for better compatibility


inactive-opacity = 0.9;
focused-opacity = 1;

opacity-rule = [
  "93:class_g = 'Alacritty'",
  "93:class_g = 'org.wezfurlong.wezterm'",
  "93:class_g = 'dev.zed.Zed'",
  "93:class_g = 'Code'"
];

# Enable and set rounded corners
corner-radius = 8
shadow-radius = 15

# Enable shadows
shadow = true
no-dock-shadow = true

# Gap settings for floating windows
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'"
];

